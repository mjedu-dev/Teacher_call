<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 교사용 호출 서비스 - 관리자용</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">⚙</div>
        <div class="brand-text">
          <h1>교사 호출 시스템 (관리자)</h1>
          <p>영천고등학교 스마트 교무실 호출 서비스 (교사용 관리자)</p>
        </div>
        <span id="mock-badge" class="mock-badge-indicator" style="display: none;">
          ⚡ Mock DB 작동 중
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <section id="admin-view" class="view-section active">
        <!-- Audio Enable Warning Banner -->
        <div id="audio-banner" class="audio-banner">
          <span>📢 브라우저 보안 정책으로 인해 실시간 음성(TTS) 알림 기능을 활성화해야 합니다.</span>
          <button id="btn-audio-enable" class="btn-audio-enable">음성 안내 활성화</button>
        </div>

        <div class="admin-container">
          <!-- Sidebar: Teacher list & Manage -->
          <aside class="admin-sidebar">
            <h3 class="sidebar-title">선생님 정보 추가</h3>
            <form id="admin-add-teacher-form" class="admin-form">
              <div class="form-group">
                <label for="new-teacher-name">선생님 이름</label>
                <input type="text" id="new-teacher-name" class="input-control" placeholder="예: 홍길동" required>
              </div>
              <div class="form-group">
                <label for="new-teacher-subject">담당 과목 / 설명</label>
                <input type="text" id="new-teacher-subject" class="input-control" placeholder="예: 수학, 1학년 3반" required>
              </div>
              <button type="submit" class="btn-admin btn-admin-primary">등록하기</button>
            </form>

            <h3 class="sidebar-title" style="margin-top: 1rem;">교사 목록 관리</h3>
            <div id="sidebar-teacher-list" class="sidebar-teacher-list">
              <!-- Dynamically populated -->
            </div>
          </aside>

          <!-- Main Admin Panel -->
          <div class="admin-main-panel">
            <!-- Active Incoming Calls -->
            <div class="active-calls-board">
              <h3 class="panel-section-title">🔔 실시간 호출 현황</h3>
              <div id="active-calls-list" class="calls-list">
                <!-- Live calling status elements -->
              </div>
            </div>

            <!-- Teacher Status Control Board -->
            <div>
              <h3 class="panel-section-title">👤 선생님 상태 일괄 관리</h3>
              <div id="teachers-admin-grid" class="teachers-admin-grid">
                <!-- Grid of switches to control states -->
              </div>
            </div>

            <!-- Calls History Log -->
            <div class="history-section">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                <h3 class="panel-section-title" style="margin-bottom: 0;">📋 호출 기록 로그</h3>
                <button id="btn-clear-logs" class="btn-admin btn-admin-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); margin: 0; border-radius: 8px;">
                  🗑 로그 전체 초기화
                </button>
              </div>
              <div class="history-table-container">
                <table class="history-table">
                  <thead>
                    <tr>
                      <th>선생님</th>
                      <th>호출 시간</th>
                      <th>호출 상태</th>
                      <th>학생 정보 (반/번호/이름)</th>
                      <th>완료/처리 시간</th>
                    </tr>
                  </thead>
                  <tbody id="history-list">
                    <!-- Call logs history rows -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
